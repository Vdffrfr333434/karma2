<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Мар'яна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    :root {
      --text: #5a4470;
      --accent: #9b7fd4;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #f8f5fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .content-wrapper {
      width: 100%;
      max-width: 500px;
    }

    .glass {
      background: white;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    h2 { text-align: center; margin-bottom: 20px; color: var(--text); }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }

    .btn {
      width: 100%; padding: 14px; background: var(--accent); color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }

    .preview-section {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .status-msg {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="content-wrapper">
  <div class="glass">
    <h2>🎁 Створити сертифікат</h2>
    
    <form id="certForm">
      <div class="form-group">
        <label>Призначення</label>
        <input type="text" id="purpose" placeholder="Консультація кармолога на 3500 грн" required>
      </div>
      <div class="form-group">
        <label>Ім'я отримувача</label>
        <input type="text" id="recipientName" placeholder="Олена Коваленко" required>
      </div>
      <div class="form-group">
        <label>Дійсний до</label>
        <input type="date" id="validUntil" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">✨ Сформувати макет</button>
      <div id="loadingStatus" class="status-msg"></div>
    </form>

    <div class="preview-section" id="previewSection">
      <canvas id="certCanvas"></canvas>
      <button class="btn" style="background: #48bb78; margin-top: 20px;" onclick="downloadPDF()">📥 Завантажити PDF</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const loadingStatus = document.getElementById('loadingStatus');
  const templateImg = new Image();
  
  // Використовуємо правильне пряме посилання (raw)
  templateImg.src = 'https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/CertificateFront.webp';
  templateImg.crossOrigin = "anonymous";

  templateImg.onload = () => {
    console.log("Картинка завантажена успішно");
    loadingStatus.innerText = "Шаблон готовий";
  };

  templateImg.onerror = () => {
    console.error("Помилка завантаження картинки");
    loadingStatus.style.color = "red";
    loadingStatus.innerText = "Помилка завантаження шаблону. Перевірте інтернет.";
  };

  function draw(data) {
    // Встановлюємо розмір канвасу як у картинки (наприклад 1000х700)
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;

    // Малюємо шаблон
    ctx.drawImage(templateImg, 0, 0);

    // --- ТЕКСТ 1: ПРИЗНАЧЕННЯ ---
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fce4c4'; 
    ctx.font = 'italic 34px Caslon, Georgia, serif';
    // Центруємо за координатами (приблизно центр по горизонталі, висота 705)
    ctx.fillText(data.purpose, canvas.width / 2, 705);

    // --- ТЕКСТ 2: ІМ'Я НА ЖОВТІЙ СМУЗІ ---
    ctx.fillStyle = '#2a1b3d'; 
    ctx.font = 'bold italic 36px Caslon, Georgia, serif';
    // Координата висоти для жовтої смуги
    ctx.fillText(data.recipientName, canvas.width / 2, 765);

    // --- ТЕКСТ 3: ДАТА ---
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fce4c4';
    ctx.font = 'italic 28px Caslon, Georgia, serif';
    const dateObj = new Date(data.validUntil);
    const dateStr = dateObj.toLocaleDateString('uk-UA');
    ctx.fillText(dateStr, canvas.width - 120, 915);

    // --- ТЕКСТ 4: КОД (внизу) ---
    ctx.textAlign = 'center';
    ctx.font = '14px Courier New';
    ctx.fillStyle = 'rgba(252, 228, 196, 0.6)';
    ctx.fillText(data.verificationCode, canvas.width / 2, canvas.height - 25);
  }

  document.getElementById('certForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    if (!templateImg.complete) {
      alert("Картинка ще завантажується, зачекайте секунду...");
      return;
    }

    const code = `ID-${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
    const data = {
      purpose: document.getElementById('purpose').value,
      recipientName: document.getElementById('recipientName').value,
      validUntil: document.getElementById('validUntil').value,
      verificationCode: code
    };

    document.getElementById('previewSection').style.display = 'block';
    draw(data);
    
    // Скрол до превью
    canvas.scrollIntoView({ behavior: 'smooth' });
  });

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png');
    
    // Створюємо PDF під точний розмір картинки
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'px',
      format: [canvas.width, canvas.height]
    });
    
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save(`Сертифікат_${document.getElementById('recipientName').value}.pdf`);
  }
</script>

</body>
</html>
