<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Мар'яна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal; font-style: italic;
    }
    body { font-family: sans-serif; background: #f0ebf5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .content-wrapper { width: 100%; max-width: 500px; }
    .glass { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2a1b3d; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; color: #2a1b3d; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; padding: 15px; background: #9b7fd4; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; font-size: 16px; }
    .preview-section { margin-top: 30px; text-align: center; display: none; }
    canvas { max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div class="content-wrapper">
  <div class="glass">
    <h2>🎁 Створити сертифікат</h2>
    <form id="certForm">
      <div class="form-group">
        <label>Ім'я отримувача</label>
        <input type="text" id="recipientName" placeholder="Олена Коваленко" required>
      </div>
      <div class="form-group">
        <label>Призначення сертифіката</label>
        <input type="text" id="purpose" placeholder="Консультація кармолога" required>
      </div>
      <div class="form-group">
        <label>Дійсний до</label>
        <input type="date" id="validUntil" required>
      </div>
      <button type="submit" class="btn">✨ Згенерувати макет</button>
    </form>
    
    <div class="preview-section" id="previewSection">
      <canvas id="certCanvas"></canvas>
      <button class="btn" style="background: #28a745; margin-top: 20px;" onclick="downloadPDF()">📥 Завантажити PDF</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const templateImg = new Image();
  
  templateImg.src = 'https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/CertificateFront2.webp';
  templateImg.crossOrigin = "anonymous";

  function draw(data) {
    canvas.width = 2480;
    canvas.height = 1754;
    ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);
    
    const purpleColor = '#2a1b3d'; 
    const goldCodeColor = '#ffce81'; 

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // --- 1. ІМ'Я (Тонше - прибрано bold) ---
    ctx.fillStyle = purpleColor;
    ctx.font = 'italic 85px Caslon, Georgia, serif';
    ctx.fillText(data.recipientName, 750, 1238);

    // --- 2. ПРИЗНАЧЕННЯ (Тонше - прибрано bold) ---
    ctx.font = 'italic 90px Caslon, Georgia, serif';
    ctx.fillText(data.purpose, canvas.width / 2, 1340);

    // --- 3. ДАТА (Arial Bold, Прямий, -2px вліво) ---
    ctx.font = 'bold 45px Arial, sans-serif'; // Прибрано italic
    const formattedDate = new Date(data.validUntil).toLocaleDateString('uk-UA');
    ctx.fillText(formattedDate, 2203, 1622); // Було 2205, стало 2203

    // --- 4. КОД ВЕРИФІКАЦІЇ (Arial Regular) ---
    ctx.fillStyle = goldCodeColor;
    ctx.font = '49px Arial, sans-serif'; 
    ctx.fillText(data.verificationCode, canvas.width / 2, 1665);
  }

  document.getElementById('certForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!templateImg.complete) return;

    const code = `ID-${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
    const data = {
      recipientName: document.getElementById('recipientName').value,
      purpose: document.getElementById('purpose').value,
      validUntil: document.getElementById('validUntil').value,
      verificationCode: code
    };

    document.getElementById('previewSection').style.display = 'block';
    draw(data);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png', 1.0);
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'px',
      format: [2480, 1754]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, 2480, 1754);
    pdf.save(`Сертифікат_${document.getElementById('recipientName').value}.pdf`);
  }
</script>

</body>
</html>
