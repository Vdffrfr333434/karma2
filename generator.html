<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Мар'яна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal; font-style: italic;
    }
    body { font-family: sans-serif; background: #f0ebf5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .content-wrapper { width: 100%; max-width: 500px; }
    .glass { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2a1b3d; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; color: #2a1b3d; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
    
    /* Кнопки пресетов */
    .preset-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .btn-preset { 
      background: #e2d9f3; color: #4b367c; border: none; padding: 6px 12px; 
      border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.2s;
    }
    .btn-preset:hover { background: #d0c1ec; }

    .btn { 
      width: 100%; padding: 15px; background: #9b7fd4; color: #4b367c; 
      border: none; border-radius: 10px; font-weight: 600; cursor: pointer; 
      margin-top: 15px; font-size: 16px; transition: 0.3s;
    }
    .btn-download { background: #48bb78; color: #1a4d2e; margin-top: 20px; }
    
    .preview-section { margin-top: 30px; text-align: center; display: none; }
    canvas { max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div class="content-wrapper">
  <div class="glass">
    <h2>Створити сертифікат</h2>
    <form id="certForm">
      <div class="form-group">
        <label>Ім'я отримувача</label>
        <input type="text" id="recipientName" placeholder="Введіть ім'я" required>
      </div>
      
      <div class="form-group">
        <label>Призначення сертифіката</label>
        <input type="text" id="purpose" placeholder="Оберіть або введіть своє" required>
        <div class="preset-container">
          <button type="button" class="btn-preset" onclick="setPurpose('консультація кармолога')">Консультація кармолога</button>
          <button type="button" class="btn-preset" onclick="setPurpose('сеанс регресії')">Сеанс регресії</button>
          <button type="button" class="btn-preset" onclick="setPurpose('розрахунок Матриці Долi')">Матриця Долi</button>
          <button type="button" class="btn-preset" onclick="setPurpose('трансформація')">Трансформація</button>
        </div>
      </div>

      <div class="form-group">
        <label>Дійсний до (порожньо = ∞)</label>
        <input type="text" id="validUntil" placeholder="31.12.2025" maxlength="10">
      </div>
      
      <button type="submit" class="btn">Сгенерувати сертификат</button>
    </form>
    
    <div class="preview-section" id="previewSection">
      <canvas id="certCanvas"></canvas>
      <button class="btn btn-download" onclick="downloadPDF()">Завантажити PDF</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const dateInput = document.getElementById('validUntil');
  const templateImg = new Image();
  
  templateImg.src = 'https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/CertificateFront2.webp';
  templateImg.crossOrigin = "anonymous";

  // Установка значения из кнопок
  function setPurpose(val) {
    document.getElementById('purpose').value = val;
  }

  // Маска даты
  dateInput.addEventListener('input', function (e) {
    let v = e.target.value.replace(/\D/g, '').slice(0, 8);
    if (v.length >= 5) {
      e.target.value = `${v.slice(0, 2)}.${v.slice(2, 4)}.${v.slice(4, 8)}`;
    } else if (v.length >= 3) {
      e.target.value = `${v.slice(0, 2)}.${v.slice(2, 4)}`;
    } else {
      e.target.value = v;
    }
  });

  function draw(data) {
    canvas.width = 2480;
    canvas.height = 1754;
    ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);
    
    const purpleColor = '#2a1b3d'; 
    const goldCodeColor = '#ffce81'; 

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 1. ИМЯ (-25% от 85px = 64px)
    ctx.fillStyle = purpleColor;
    ctx.font = 'italic 64px Caslon, Georgia, serif';
    ctx.fillText(data.recipientName, 800, 1238);

    // 2. НАЗНАЧЕНИЕ (-25% от 90px = 68px)
    ctx.font = 'italic 68px Caslon, Georgia, serif';
    ctx.fillText(data.purpose, canvas.width / 2, 1340);

    // 3. ДАТА (Теперь Caslon как и имя, бесконечность если пусто)
    ctx.font = 'italic 45px Caslon, Georgia, serif';
    const displayDate = data.date.trim() === "" ? "∞" : data.date;
    ctx.fillText(displayDate, 2203, 1622); 

    // 4. КОД ВЕРИФИКАЦИИ (Arial, тоньше, +5px вниз)
    ctx.fillStyle = goldCodeColor;
    ctx.font = '300 44px Arial, sans-serif'; // 300 - легкий вес
    ctx.fillText(data.verificationCode, canvas.width / 2, 1670);
  }

  document.getElementById('certForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!templateImg.complete) return;

    const code = `ID-${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
    const data = {
      recipientName: document.getElementById('recipientName').value,
      purpose: document.getElementById('purpose').value,
      date: dateInput.value,
      verificationCode: code
    };

    document.getElementById('previewSection').style.display = 'block';
    draw(data);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });

 function downloadPDF() {
  const { jsPDF } = window.jspdf;
  // Змініть 'image/png' на 'image/jpeg' та додайте 0.7 (якість 70%)
  const imgData = canvas.toDataURL('image/jpeg', 0.7); 
  
  const pdf = new jsPDF({
    orientation: 'landscape',
    unit: 'px',
    format: [2480, 1754]
  });
  
  // Тут також змініть 'PNG' на 'JPEG'
  pdf.addImage(imgData, 'JPEG', 0, 0, 2480, 1754);
  pdf.save(`Certificate_${document.getElementById('recipientName').value}.pdf`);
}
</script>

</body>
</html>
