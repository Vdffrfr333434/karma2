<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Марьяна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://github.com/Vdffrfr333434/karma2/raw/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    :root{
      --bg1:#9b7fd4;
      --bg2:#c9a0dc;
      --bg3:#8b7ba5;
      --glass:rgba(139, 123, 165, 0.08);
      --border:rgba(139, 123, 165, 0.2);
      --text:#5a4470;
      --text-muted:#8b7ba5;
      --gold:#9b7fd4;
      --lavender:#c9a0dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: #f8f5fa;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Morphing gradient background */
    #gradient-canvas {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.4;
    }

    #noise-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: 0.015;
      z-index: 1;
    }

    .content-wrapper {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;
      padding: 20px 16px;
    }

    .glass {
      position: relative;
      background: rgba(250, 245, 255, 0.65);
      border: 1px solid rgba(139, 123, 165, 0.15);
      box-shadow: 0 8px 32px rgba(139, 123, 165, 0.08);
      border-radius: 10px;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      overflow: hidden;
    }

    .no-diamond::before {
      content: none !important;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      background: rgba(250, 245, 255, 0.5);
      border: 1px solid rgba(139, 123, 165, 0.15);
      border-radius: 8px;
      transition: all 0.3s;
    }

    .tab.active {
      color: var(--text);
      background: rgba(155, 127, 212, 0.15);
      border-color: rgba(155, 127, 212, 0.3);
    }

    .tab:hover {
      background: rgba(155, 127, 212, 0.1);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .info-box {
      background: rgba(155, 127, 212, 0.1);
      border-left: 4px solid var(--gold);
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-weight: 500;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(139, 123, 165, 0.2);
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--text);
      font-family: inherit;
      transition: all 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 0 0 3px rgba(155, 127, 212, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: rgba(155, 127, 212, 0.05);
      border: 1px solid #8b7ba5;
      color: var(--text);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .btn:hover {
      background: rgba(155, 127, 212, 0.15);
      box-shadow: 0 4px 16px rgba(139, 123, 165, 0.2);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(72, 187, 120, 0.1);
      border-color: #48bb78;
      color: #2f855a;
    }

    .btn-secondary:hover {
      background: rgba(72, 187, 120, 0.2);
    }

    .preview {
      margin-top: 20px;
      padding: 16px;
      background: rgba(250, 245, 255, 0.5);
      border: 2px dashed rgba(139, 123, 165, 0.3);
      border-radius: 10px;
      text-align: center;
    }

    .preview h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .preview canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(139, 123, 165, 0.2);
      margin-bottom: 12px;
    }

    #qrPreview {
      margin: 12px auto;
      display: inline-block;
    }

    .code-display {
      background: var(--text);
      color: #48bb78;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      margin: 12px 0;
      word-break: break-all;
    }

    .result {
      margin-top: 16px;
      padding: 16px;
      background: rgba(72, 187, 120, 0.1);
      border: 2px solid rgba(72, 187, 120, 0.3);
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .result.show {
      display: block;
    }

    .result h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .result p {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .result.error {
      background: rgba(252, 129, 129, 0.1);
      border-color: rgba(252, 129, 129, 0.3);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      padding: 8px 12px;
      background: rgba(250, 245, 255, 0.5);
      border-radius: 6px;
      transition: all 0.3s;
    }

    .back-link:hover {
      background: rgba(155, 127, 212, 0.15);
      transform: translateX(-4px);
    }

    @media (max-width: 768px) {
      .content-wrapper {
        padding: 16px;
      }
      
      h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<canvas id="gradient-canvas"></canvas>
<canvas id="noise-overlay"></canvas>

<div class="content-wrapper">
  <br><br>
  
  <a href="index.html" class="back-link">← Повернутися на головну</a>

  <div class="glass no-diamond" style="padding: 24px;">
    <h2>🎁 Генератор сертифікатів</h2>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('generate')">
        Створити
      </div>
      <div class="tab" onclick="switchTab('verify')">
        Перевірити
      </div>
    </div>

    <!-- TAB 1: GENERATE -->
    <div id="generateTab" class="tab-content active">
      <div class="info-box">
        ℹ️ Заповніть усі поля. Система автоматично створить код верифікації та QR-код для перевірки.
      </div>

      <form id="certForm">
        <div class="form-group">
          <label for="recipientName">Ім'я отримувача *</label>
          <input type="text" id="recipientName" placeholder="Наприклад: Олена Коваленко" required>
        </div>

        <div class="form-group">
          <label for="purpose">Призначення *</label>
          <textarea id="purpose" placeholder="Наприклад: Консультація кармолога (3500 грн)" required></textarea>
        </div>

        <div class="form-group">
          <label for="validUntil">Дійсний до *</label>
          <input type="date" id="validUntil" required>
        </div>

        <button type="submit" class="btn">🎨 Згенерувати сертифікат</button>
      </form>

      <div class="preview" id="previewSection" style="display: none;">
        <h3>Попередній перегляд:</h3>
        <canvas id="certCanvas"></canvas>
        <div id="qrPreview"></div>
        <div class="code-display" id="verificationCode"></div>
        <button class="btn btn-secondary" onclick="downloadPDF()">📥 Завантажити PDF</button>
      </div>
    </div>

    <!-- TAB 2: VERIFY -->
    <div id="verifyTab" class="tab-content">
      <div class="info-box">
        🔍 Введіть код з сертифікату для перевірки автентичності.
      </div>

      <form id="verifyForm">
        <div class="form-group">
          <label for="verifyCode">Код верифікації</label>
          <input type="text" id="verifyCode" placeholder="CERT-XXXXXX-XXXXXXXX" required>
        </div>

        <button type="submit" class="btn">🔎 Перевірити</button>
      </form>

      <div class="result" id="verifyResult"></div>
    </div>
  </div>
</div>

<script>
  // ===== GRADIENT BACKGROUND =====
  const canvas = document.getElementById('gradient-canvas');
  const ctx = canvas.getContext('2d');
  const noiseCanvas = document.getElementById('noise-overlay');
  const noiseCtx = noiseCanvas.getContext('2d');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  noiseCanvas.width = width;
  noiseCanvas.height = height;

  const colorPalette = [
    [120, 100, 200],
    [155, 127, 212],
    [201, 160, 220],
    [139, 123, 165],
    [180, 140, 230],
  ];

  class ColorBlob {
    constructor(x, y, colorIndex) {
      this.x = x;
      this.y = y;
      this.baseRadius = 200 + Math.random() * 150;
      this.color = colorPalette[colorIndex];
      this.offset = Math.random() * Math.PI * 2;
      this.speed = 0.0003 + Math.random() * 0.0002;
    }

    update(time) {
      this.x += Math.sin(time * this.speed + this.offset) * 0.2;
      this.y += Math.cos(time * this.speed * 1.3 + this.offset) * 0.2;
      this.radius = this.baseRadius + Math.sin(time * 0.001 + this.offset) * 30;
    }

    draw(time) {
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
      const brightness = 0.9 + Math.sin(time * 0.002 + this.offset) * 0.1;
      
      gradient.addColorStop(0, `rgba(${this.color[0] * brightness}, ${this.color[1] * brightness}, ${this.color[2] * brightness}, 1)`);
      gradient.addColorStop(0.4, `rgba(${this.color[0] * brightness}, ${this.color[1] * brightness}, ${this.color[2] * brightness}, 0.6)`);
      gradient.addColorStop(1, `rgba(${this.color[0] * brightness}, ${this.color[1] * brightness}, ${this.color[2] * brightness}, 0)`);

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }
  }

  const blobs = [
    new ColorBlob(width * 0.2, height * 0.3, 0),
    new ColorBlob(width * 0.8, height * 0.2, 1),
    new ColorBlob(width * 0.5, height * 0.7, 2),
    new ColorBlob(width * 0.1, height * 0.8, 3),
    new ColorBlob(width * 0.9, height * 0.6, 4),
  ];

  function drawNoise() {
    const noiseWidth = Math.floor(width / 2);
    const noiseHeight = Math.floor(height / 2);
    const imageData = noiseCtx.createImageData(noiseWidth, noiseHeight);
    const data = imageData.data;
    
    for (let i = 0; i < data.length; i += 4) {
      const noise = Math.random() * 255;
      data[i] = noise;
      data[i + 1] = noise;
      data[i + 2] = noise;
      data[i + 3] = 255;
    }
    
    noiseCtx.clearRect(0, 0, width, height);
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = noiseWidth;
    tempCanvas.height = noiseHeight;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(imageData, 0, 0);
    
    noiseCtx.imageSmoothingEnabled = false;
    noiseCtx.drawImage(tempCanvas, 0, 0, noiseWidth, noiseHeight, 0, 0, width, height);
  }

  let time = 0;
  let noiseFrame = 0;

  function animate() {
    ctx.fillStyle = 'rgba(10, 10, 10, 1)';
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter';
    
    blobs.forEach(blob => {
      blob.update(time);
      blob.draw(time);
    });

    ctx.globalCompositeOperation = 'source-over';

    noiseFrame++;
    if (noiseFrame % 10 === 0) {
      drawNoise();
    }

    time++;
    requestAnimationFrame(animate);
  }

  drawNoise();
  animate();

  // ===== CERTIFICATE LOGIC =====
  let currentCertData = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if (tab === 'generate') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('generateTab').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('verifyTab').classList.add('active');
    }
  }

  function generateVerificationCode(name, purpose, date) {
    const timestamp = Date.now();
    const random = Math.random().toString(36).substring(2, 8).toUpperCase();
    const hash = btoa(`${name}|${purpose}|${date}|${timestamp}`).substring(0, 16);
    return `CERT-${random}-${hash}`.replace(/[=/+]/g, '');
  }

  async function saveCertificate(code, data) {
    try {
      await window.storage.set(`cert:${code}`, JSON.stringify(data), true);
      console.log('Сертифікат збережено:', code);
    } catch (error) {
      console.error('Помилка збереження:', error);
    }
  }

  document.getElementById('certForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name = document.getElementById('recipientName').value;
    const purpose = document.getElementById('purpose').value;
    const validUntil = document.getElementById('validUntil').value;

    const verificationCode = generateVerificationCode(name, purpose, validUntil);

    currentCertData = {
      name,
      purpose,
      validUntil,
      verificationCode,
      issueDate: new Date().toISOString(),
      status: 'active'
    };

    await saveCertificate(verificationCode, currentCertData);
    
    // Очищаем canvas перед новым рисованием
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawCertificate(currentCertData);

    document.getElementById('previewSection').style.display = 'block';
    document.getElementById('verificationCode').textContent = verificationCode;

    // Очищаем старый QR-код и создаём новый
    const qrContainer = document.getElementById('qrPreview');
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, {
      text: verificationCode,
      width: 120,
      height: 120
    });
    
    // Скроллим к превью
    document.getElementById('previewSection').scrollIntoView({ 
      behavior: 'smooth', 
      block: 'nearest' 
    });
  });

  // ===== РИСОВАНИЕ СЕРТИФИКАТА =====
  function drawCertificate(data) {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    
    const scale = 2;
    const displayWidth = 400;
    const displayHeight = 280;
    
    canvas.width = displayWidth * scale;
    canvas.height = displayHeight * scale;
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
    
    ctx.scale(scale, scale);

    // Градиент фона в тонах главной страницы (белый, серый, лиловый)
    const bgColors = [
      ['#FFFFFF', '#F0EDF5', '#E8E1F0'], // Белый → светло-лиловый
      ['#F8F5FA', '#EDE8F5', '#E0D5EC'], // Бледный → лиловый
      ['#FAFAFA', '#F2EDF7', '#DCD0E8'], // Светло-серый → лиловый
      ['#FFFFFF', '#EBE5F2', '#D8CCDF'], // Белый → серо-лиловый
    ];
    
    const randomPalette = bgColors[Math.floor(Math.random() * bgColors.length)];
    
    const gradient = ctx.createLinearGradient(0, 0, displayWidth, displayHeight);
    gradient.addColorStop(0, randomPalette[0]);
    gradient.addColorStop(0.5, randomPalette[1]);
    gradient.addColorStop(1, randomPalette[2]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, displayWidth, displayHeight);

    // Добавляем зернистость (noise texture)
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < displayWidth * displayHeight / 4; i++) {
      const x = Math.random() * displayWidth;
      const y = Math.random() * displayHeight;
      const brightness = Math.random() * 255;
      ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1.0;

    // Декоративная рамка золотого цвета (толщина вдвое меньше)
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(20, 20, displayWidth - 40, displayHeight - 40);
    
    // Внутренняя тонкая рамка
    ctx.strokeStyle = '#C9A961';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(25, 25, displayWidth - 50, displayHeight - 50);

    // Заголовок - Caslon шрифт (золотистый)
    ctx.fillStyle = '#D4AF37';
    ctx.font = 'italic 28px Caslon, Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('Подарунковий Сертифікат', displayWidth / 2, 60);

    // Декоративная линия
    ctx.beginPath();
    ctx.moveTo(80, 75);
    ctx.lineTo(320, 75);
    ctx.strokeStyle = '#C9A961';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Текст сертификата (золотистый шрифт)
    ctx.fillStyle = '#B8860B';
    ctx.textAlign = 'left';
    
    // "Для:" и имя получателя в одну строку
    ctx.font = 'italic 16px Caslon, Georgia, serif';
    const forText = 'Для: ';
    const forWidth = ctx.measureText(forText).width;
    ctx.fillText(forText, 50, 110);
    
    ctx.font = 'italic bold 20px Caslon, Georgia, serif';
    ctx.fillText(data.name, 50 + forWidth, 110);

    // "Призначення:" и описание в одну строку (с переносом если нужно)
    ctx.font = 'italic 15px Caslon, Georgia, serif';
    const purposeLabel = 'Призначення: ';
    const purposeLabelWidth = ctx.measureText(purposeLabel).width;
    ctx.fillText(purposeLabel, 50, 145);
    
    ctx.font = 'italic 13px Caslon, Georgia, serif';
    wrapText(ctx, data.purpose, 50 + purposeLabelWidth, 145, 300 - purposeLabelWidth, 16);

    // Срок действия - правый нижний угол (в пределах внутренней рамки)
    ctx.font = 'italic 12px Caslon, Georgia, serif';
    ctx.textAlign = 'right';
    ctx.fillText(`Дійсний до: ${formatDate(data.validUntil)}`, displayWidth - 35, displayHeight - 35);

    // Код верификации - за пределами рамки, по центру, ниже
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8B7ba5';
    ctx.fillText(`Код верифікації: ${data.verificationCode}`, displayWidth / 2, displayHeight - 8);
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let currentY = y;

    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, currentY);
        line = words[n] + ' ';
        currentY += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, currentY);
  }

  function formatDate(dateString) {
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    return new Date(dateString).toLocaleDateString('uk-UA', options);
  }

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const canvas = document.getElementById('certCanvas');
    
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'mm',
      format: [148, 105] // A6 landscape
    });

    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 5, 5, 138, 95);
    
    pdf.save(`Сертифікат_${currentCertData.name.replace(/\s/g, '_')}.pdf`);
  }

  document.getElementById('verifyForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const code = document.getElementById('verifyCode').value.trim();
    const resultDiv = document.getElementById('verifyResult');

    try {
      const result = await window.storage.get(`cert:${code}`, true);
      
      if (!result) {
        resultDiv.className = 'result show error';
        resultDiv.innerHTML = `
          <h3>❌ Сертифікат не знайдено</h3>
          <p>Код не існує в системі.</p>
        `;
        return;
      }

      const data = JSON.parse(result.value);
      const validUntil = new Date(data.validUntil);
      const today = new Date();
      const isExpired = validUntil < today;

      resultDiv.className = 'result show';
      resultDiv.innerHTML = `
        <h3>✅ Сертифікат автентичний</h3>
        <p><strong>Отримувач:</strong> ${data.name}</p>
        <p><strong>Призначення:</strong> ${data.purpose}</p>
        <p><strong>Виданий:</strong> ${formatDate(data.issueDate)}</p>
        <p><strong>Дійсний до:</strong> ${formatDate(data.validUntil)}</p>
        <p><strong>Статус:</strong> ${isExpired ? '⚠️ Закінчився' : '✅ Активний'}</p>
      `;
    } catch (error) {
      resultDiv.className = 'result show error';
      resultDiv.innerHTML = `<h3>❌ Помилка</h3><p>Спробуйте ще раз.</p>`;
    }
  });

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('validUntil').setAttribute('min', today);
</script>
