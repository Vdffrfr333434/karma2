<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Мар'яна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #f8f5fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .content-wrapper { width: 100%; max-width: 500px; }

    .glass {
      background: white;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    h2 { text-align: center; margin-bottom: 20px; color: #5a4470; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }

    .btn {
      width: 100%; padding: 14px; background: #9b7fd4; color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }

    .preview-section { margin-top: 25px; text-align: center; display: none; }

    canvas {
      max-width: 100%; height: auto; border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .status-msg { font-size: 12px; color: #666; margin-top: 5px; text-align: center; }
  </style>
</head>
<body>

<div class="content-wrapper">
  <div class="glass">
    <h2>🎁 Створити сертифікат</h2>
    
    <form id="certForm">
      <div class="form-group">
        <label>Призначення</label>
        <input type="text" id="purpose" placeholder="Консультація кармолога на 3500 грн" required>
      </div>
      <div class="form-group">
        <label>Ім'я отримувача</label>
        <input type="text" id="recipientName" placeholder="Олена Коваленко" required>
      </div>
      <div class="form-group">
        <label>Дійсний до</label>
        <input type="date" id="validUntil" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">✨ Сформувати макет</button>
      <div id="loadingStatus" class="status-msg">Завантаження шаблону...</div>
    </form>

    <div class="preview-section" id="previewSection">
      <canvas id="certCanvas"></canvas>
      <button class="btn" style="background: #48bb78; margin-top: 20px;" onclick="downloadPDF()">📥 Завантажити PDF</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const loadingStatus = document.getElementById('loadingStatus');
  const templateImg = new Image();
  
  templateImg.src = 'https://raw.githubusercontent.com/Vdffrfr333434/karma2/main/CertificateFront2.webp';
  templateImg.crossOrigin = "anonymous";

  templateImg.onload = () => { loadingStatus.innerText = "Шаблон готовий"; };
  templateImg.onerror = () => { loadingStatus.innerText = "Помилка завантаження шаблону"; };

  function draw(data) {
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;
    ctx.drawImage(templateImg, 0, 0);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // --- ПРИЗНАЧЕННЯ (Збільшено в 3 рази, Колір: Зелений) ---
    ctx.fillStyle = '#1b4d3e'; // Насичений темно-зелений
    ctx.font = 'italic 102px Caslon, Georgia, serif'; // Було 34, стало 102
    ctx.fillText(data.purpose, canvas.width / 2, 690);

    // --- ІМ'Я НА ЖОВТІЙ СМУЗІ (Збільшено в 3 рази, Колір: Зелений) ---
    ctx.fillStyle = '#1b4d3e'; 
    ctx.font = 'bold italic 108px Caslon, Georgia, serif'; // Було 36, стало 108
    ctx.fillText(data.recipientName, canvas.width / 2, 775);

    // --- ДАТА (у правому нижньому куті) ---
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fce4c4';
    ctx.font = 'italic 28px Caslon, Georgia, serif';
    const dateStr = new Date(data.validUntil).toLocaleDateString('uk-UA');
    ctx.fillText(dateStr, canvas.width - 120, 915);

    // --- КОД ВЕРИФІКАЦІЇ (Збільшено в 4 рази, Колір: Золотистий) ---
    ctx.textAlign = 'center';
    ctx.fillStyle = '#D4AF37'; // Золотистий
    ctx.font = 'bold 56px Courier New'; // Було 14, стало 56
    ctx.fillText(data.verificationCode, canvas.width / 2, canvas.height - 60);
  }

  document.getElementById('certForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!templateImg.complete) return;

    const code = `ID-${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
    const data = {
      purpose: document.getElementById('purpose').value,
      recipientName: document.getElementById('recipientName').value,
      validUntil: document.getElementById('validUntil').value,
      verificationCode: code
    };

    document.getElementById('previewSection').style.display = 'block';
    draw(data);
    canvas.scrollIntoView({ behavior: 'smooth' });
  });

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'px',
      format: [canvas.width, canvas.height]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save(`Сертифікат_${document.getElementById('recipientName').value}.pdf`);
  }
</script>

</body>
</html>
