<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Мар'яна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://github.com/Vdffrfr333434/karma2/raw/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    :root {
      --text: #5a4470;
      --accent: #9b7fd4;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #f8f5fa;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .content-wrapper {
      width: 100%;
      max-width: 500px;
    }

    .glass {
      background: white;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    h2 { text-align: center; margin-bottom: 20px; color: var(--text); }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px;
    }

    .btn {
      width: 100%; padding: 14px; background: var(--accent); color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }

    .preview-section {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .code-info {
      margin: 15px 0;
      font-family: monospace;
      color: #d4af37;
      background: #2a1b3d;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="content-wrapper">
  <div class="glass">
    <h2>🎁 Створити сертифікат</h2>
    
    <form id="certForm">
      <div class="form-group">
        <label>Призначення (наприклад: Консультація кармолога)</label>
        <input type="text" id="purpose" placeholder="Консультація кармолога на 3500 грн" required>
      </div>
      <div class="form-group">
        <label>Ім'я отримувача (для жовтої лінії)</label>
        <input type="text" id="recipientName" placeholder="Олена Коваленко" required>
      </div>
      <div class="form-group">
        <label>Дійсний до</label>
        <input type="date" id="validUntil" required>
      </div>
      <button type="submit" class="btn">✨ Сформувати макет</button>
    </form>

    <div class="preview-section" id="previewSection">
      <canvas id="certCanvas"></canvas>
      <div class="code-info" id="codeDisplay"></div>
      <button class="btn" style="background: #48bb78;" onclick="downloadPDF()">📥 Завантажити у PDF</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const templateImg = new Image();
  
  // ВСТАВТЕ ПОСИЛАННЯ НА ВАШУ КАРТИНКУ ТУТ:
  templateImg.src = 'https://github.com/Vdffrfr333434/karma2/blob/main/CertificateFront.webp?raw=true'; 
  templateImg.crossOrigin = "anonymous";

  function draw(data) {
    // Встановлюємо розмір канвасу як у картинки
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;

    // Малюємо фон
    ctx.drawImage(templateImg, 0, 0);

    // Налаштування тексту
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fce4c4'; // Колір, близький до вашого золотистого на картинці
    ctx.font = 'italic 36px Caslon, Georgia, serif';

    // 1. ПРИЗНАЧЕННЯ (на місці "Консультация кармолога...")
    // Орієнтовні координати на основі вашого макета
    ctx.fillText(data.purpose, canvas.width / 2, 705);

    // 2. ІМ'Я ОТРИМУВАЧА (на жовтому полі)
    ctx.fillStyle = '#2a1b3d'; // Темний колір для контрасту на жовтому фоні
    ctx.font = 'bold italic 32px Caslon, Georgia, serif';
    ctx.fillText(data.recipientName, canvas.width / 2, 765);

    // 3. ДАТА (у правому нижньому куті)
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fce4c4';
    ctx.font = 'italic 28px Caslon, Georgia, serif';
    const dateStr = new Date(data.validUntil).toLocaleDateString('uk-UA');
    ctx.fillText(dateStr, 880, 915);

    // 4. КОД ВЕРИФІКАЦІЇ (у самому низу по центру)
    ctx.textAlign = 'center';
    ctx.font = '14px Courier New';
    ctx.fillStyle = 'rgba(252, 228, 196, 0.5)';
    ctx.fillText(data.verificationCode, canvas.width / 2, canvas.height - 20);
  }

  document.getElementById('certForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const code = `ID-${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
    const data = {
      purpose: document.getElementById('purpose').value,
      recipientName: document.getElementById('recipientName').value,
      validUntil: document.getElementById('validUntil').value,
      verificationCode: code
    };

    document.getElementById('previewSection').style.display = 'block';
    document.getElementById('codeDisplay').textContent = `Код сертифіката: ${code}`;
    
    // Перевіряємо чи завантажилась картинка
    if (templateImg.complete) {
      draw(data);
    } else {
      templateImg.onload = () => draw(data);
    }
  });

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png');
    // Створюємо PDF формату А4 альбомний або під розмір картинки
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'px',
      format: [canvas.width, canvas.height]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save(`Сертифікат_${document.getElementById('recipientName').value}.pdf`);
  }
</script>

</body>
</html>
