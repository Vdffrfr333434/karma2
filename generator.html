<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сертифікатів | Марьяна</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @font-face {
      font-family: 'Caslon';
      src: url('https://github.com/Vdffrfr333434/karma2/raw/main/caslonbeckerno540swashrus_italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    :root{
      --bg1:#9b7fd4;
      --bg2:#c9a0dc;
      --text:#5a4470;
      --gold:#9b7fd4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: var(--text);
      background: #f8f5fa;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .content-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px;
      z-index: 2;
    }

    .glass {
      background: rgba(250, 245, 255, 0.85);
      border: 1px solid rgba(139, 123, 165, 0.15);
      box-shadow: 0 8px 32px rgba(139, 123, 165, 0.1);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }

    .tab {
      flex: 1; padding: 12px; text-align: center; cursor: pointer;
      font-weight: 600; font-size: 14px; color: #8b7ba5;
      background: rgba(250, 245, 255, 0.5); border: 1px solid rgba(139, 123, 165, 0.15);
      border-radius: 8px; transition: 0.3s;
    }

    .tab.active {
      color: var(--text); background: rgba(155, 127, 212, 0.15);
      border-color: rgba(155, 127, 212, 0.3);
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid rgba(139, 123, 165, 0.2);
      border-radius: 8px; font-size: 14px; background: white;
    }

    .btn {
      width: 100%; padding: 12px; background: #9b7fd4; color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .preview {
      margin-top: 20px; padding: 16px; border: 2px dashed #c9a0dc;
      border-radius: 10px; text-align: center;
    }

    .preview canvas {
      max-width: 100%; height: auto; border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .code-display {
      background: #5a4470; color: #d4af37; padding: 10px;
      border-radius: 6px; font-family: monospace; font-size: 14px;
      margin: 15px 0; font-weight: bold;
    }

    .back-link {
      display: inline-block; margin-bottom: 15px; color: var(--text);
      text-decoration: none; font-size: 14px;
    }
  </style>
</head>
<body>

<div class="content-wrapper">
  <a href="index.html" class="back-link">← Назад</a>

  <div class="glass">
    <h2>🎁 Створити сертифікат</h2>

    <div class="tabs">
      <div class="tab active" id="tab-gen">Створення</div>
      <div class="tab" id="tab-ver">Перевірка</div>
    </div>

    <form id="certForm">
      <div class="form-group">
        <label>Ім'я отримувача</label>
        <input type="text" id="recipientName" placeholder="Олена Коваленко" required>
      </div>
      <div class="form-group">
        <label>Призначення</label>
        <textarea id="purpose" placeholder="Консультація кармолога" required></textarea>
      </div>
      <div class="form-group">
        <label>Дійсний до</label>
        <input type="date" id="validUntil" required>
      </div>
      <button type="submit" class="btn">Згенерувати</button>
    </form>

    <div class="preview" id="previewSection" style="display: none;">
      <canvas id="certCanvas"></canvas>
      <div class="code-display" id="verificationCodeDisplay"></div>
      <button class="btn" style="background: #48bb78;" onclick="downloadPDF()">Завантажити PDF</button>
    </div>
  </div>
</div>

<script>
  function drawDiamond(ctx, x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x + size * 0.8, y);
    ctx.lineTo(x, y + size);
    ctx.lineTo(x - size * 0.8, y);
    ctx.closePath();
    ctx.fill();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else { line = testLine; }
    }
    ctx.fillText(line, x, y);
  }

  function drawCertificate(data) {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const scale = 2;
    const w = 400, h = 280;
    
    canvas.width = w * scale;
    canvas.height = h * scale;
    ctx.scale(scale, scale);

    // 1. Градієнт без білого (Рожево-бузковий)
    const gradient = ctx.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, '#e0aaff'); // Світлий бузок
    gradient.addColorStop(0.5, '#c9a0dc'); // Рожево-бузковий
    gradient.addColorStop(1, '#ff99c8'); // Теплий рожевий
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    // Зернистість (Noise)
    ctx.globalAlpha = 0.07;
    for (let i = 0; i < 6000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
      ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
    ctx.globalAlpha = 1.0;

    // 2. Рамка (одна тонка золота)
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = 0.7;
    ctx.strokeRect(15, 15, w - 30, h - 30);

    // 3. Заголовок
    ctx.fillStyle = '#D4AF37';
    ctx.font = 'italic 21px Caslon, Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Подарунковий Сертифікат', w / 2, 50);

    // 4. Текст "Для"
    ctx.textAlign = 'left';
    ctx.fillStyle = '#B8860B';
    ctx.font = 'italic 16px Caslon, Georgia, serif';
    const forLabel = 'Для: ';
    const labelW = ctx.measureText(forLabel).width;
    ctx.fillText(forLabel, 50, 105);
    ctx.fillText(data.name, 50 + labelW, 105);

    // 5. Призначення
    const purpLabel = 'Призначення: ';
    const purpLabelW = ctx.measureText(purpLabel).width;
    ctx.fillText(purpLabel, 50, 140);
    wrapText(ctx, data.purpose, 50 + purpLabelW, 140, 280 - purpLabelW, 18);

    // 6. Паттерн діамантів
    ctx.fillStyle = 'rgba(212, 175, 55, 0.3)';
    const cx = w - 60, cy = h - 60;
    drawDiamond(ctx, cx + 20, cy + 20, 9);
    drawDiamond(ctx, cx + 40, cy + 5, 5);
    drawDiamond(ctx, cx + 5, cy + 40, 6);

    // 7. Срок дії (Такий самий розмір 16px)
    ctx.fillStyle = '#B8860B';
    ctx.font = 'italic 15px Caslon, Georgia, serif';
    ctx.textAlign = 'right';
    const dateStr = new Date(data.validUntil).toLocaleDateString('uk-UA', {year:'numeric', month:'long', day:'numeric'});
    ctx.fillText(`Дійсний до: ${dateStr}`, w - 40, h - 45);

    // 8. Код (Опущено ще нижче, колір золото)
    ctx.font = 'bold 8px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#D4AF37';
    ctx.fillText(data.verificationCode, w / 2, h - 6); // Максимально низько
  }

  let currentData = null;
  document.getElementById('certForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = `CERT-${Math.random().toString(36).substr(2,6).toUpperCase()}`;
    currentData = {
      name: document.getElementById('recipientName').value,
      purpose: document.getElementById('purpose').value,
      validUntil: document.getElementById('validUntil').value,
      verificationCode: code
    };
    document.getElementById('previewSection').style.display = 'block';
    document.getElementById('verificationCodeDisplay').textContent = code;
    drawCertificate(currentData);
  });

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const canvas = document.getElementById('certCanvas');
    const pdf = new jsPDF('l', 'mm', [148, 105]);
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 148, 105);
    pdf.save(`Сертифікат_${currentData.name}.pdf`);
  }
</script>
</body>
</html>
