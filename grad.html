<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Morphing Grain Gradient · Strong Texture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ===== GRADIENT BASE ===== */
    body {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(at 15% 20%, #ff7a18, transparent 55%),
        radial-gradient(at 80% 10%, #7a5cff, transparent 50%),
        radial-gradient(at 30% 80%, #00ffd5, transparent 55%),
        radial-gradient(at 70% 70%, #ff3cac, transparent 55%),
        linear-gradient(120deg, #0f0c29, #302b63, #24243e);

      background-size: 260% 260%;
      animation: gradientMorph 20s ease-in-out infinite;

      /* меньше blur → лучше читается рельеф */
      filter: blur(14px) saturate(130%) contrast(115%);
    }

    /* ===== ORANGE PEEL (COARSE) ===== */
    body::before {
      content: "";
      position: absolute;
      inset: -120%;
      pointer-events: none;

      background-image: url("data:image/svg+xml;utf8,\
      <svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>\
        <filter id='peel'>\
          <feTurbulence type='turbulence' baseFrequency='0.28' numOctaves='1' seed='2'/>\
          <feDisplacementMap in='SourceGraphic' scale='26'/>\
        </filter>\
        <rect width='100%' height='100%' filter='url(%23peel)' opacity='0.14'/>\
      </svg>");

      mix-blend-mode: overlay;
    }

    /* ===== MICRO ORANGE PEEL ===== */
    body::after {
      content: "";
      position: absolute;
      inset: -200%;
      pointer-events: none;

      background-image: url("data:image/svg+xml;utf8,\
      <svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
        <filter id='micro'>\
          <feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/>\
        </filter>\
        <rect width='100%' height='100%' filter='url(%23micro)' opacity='0.18'/>\
      </svg>");

      mix-blend-mode: soft-light;
      animation: grainMove 0.9s steps(6) infinite;
    }

    /* ===== LABEL ===== */
    .label {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.08em;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes gradientMorph {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes grainMove {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-3%, 3%); }
      50%  { transform: translate(3%, -3%); }
      75%  { transform: translate(-3%, -3%); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>

<body>
  <div class="label">Morphing Grain Gradient · Strong Orange Peel</div>
</body>
</html>
