<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Grainy Gradient</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
        }

        #gradient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(60px);
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .content h1 {
            font-size: 4rem;
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        #noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
            z-index: 5;
        }
    </style>
</head>
<body>
    <canvas id="gradient-canvas"></canvas>
    <canvas id="noise-overlay"></canvas>
    <div class="content">
       
    </div>

    <script>
        const canvas = document.getElementById('gradient-canvas');
        const ctx = canvas.getContext('2d');
        const noiseCanvas = document.getElementById('noise-overlay');
        const noiseCtx = noiseCanvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        noiseCanvas.width = width;
        noiseCanvas.height = height;

        // Цветовая палитра
        const colorPalette = [
            [139, 69, 255],   // Фиолетовый
            [255, 71, 179],   // Розовый
            [71, 191, 255],   // Голубой
            [255, 146, 71],   // Оранжевый
            [100, 255, 150]   // Зеленый
        ];

        // Класс для цветного пятна
        class ColorBlob {
            constructor(x, y, colorIndex) {
                this.x = x;
                this.y = y;
                this.baseRadius = 200 + Math.random() * 150;
                this.color = colorPalette[colorIndex];
                this.offset = Math.random() * Math.PI * 2;
                this.speed = 0.002 + Math.random() * 0.001;
                this.noiseScale = 0.002 + Math.random() * 0.001;
            }

            update(time) {
                // Органическое движение по Perlin-подобной траектории
                this.x += Math.sin(time * this.speed + this.offset) * 0.3;
                this.y += Math.cos(time * this.speed * 1.3 + this.offset) * 0.3;
                
                // Пульсация
                this.radius = this.baseRadius + Math.sin(time * 0.001 + this.offset) * 30;
            }

            draw(time) {
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );

                // Анимация яркости
                const brightness = 0.9 + Math.sin(time * 0.002 + this.offset) * 0.1;
                
                gradient.addColorStop(0, `rgba(${this.color[0] * brightness}, ${this.color[1] * brightness}, ${this.color[2] * brightness}, 1)`);
                gradient.addColorStop(0.4, `rgba(${this.color[0] * brightness}, ${this.color[1] * brightness}, ${this.color[2] * brightness}, 0.6)`);
                gradient.addColorStop(1, `rgba(${this.color[0] * brightness}, ${this.color[1] * brightness}, ${this.color[2] * brightness}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            }
        }

        // Создаем пятна сразу на видимых позициях
        const blobs = [
            new ColorBlob(width * 0.2, height * 0.3, 0),
            new ColorBlob(width * 0.8, height * 0.2, 1),
            new ColorBlob(width * 0.5, height * 0.7, 2),
            new ColorBlob(width * 0.1, height * 0.8, 3),
            new ColorBlob(width * 0.9, height * 0.6, 4),
            new ColorBlob(width * 0.6, height * 0.4, 1),
            new ColorBlob(width * 0.3, height * 0.6, 2)
        ];

        // Создание зернистой текстуры
        function drawNoise() {
            const imageData = noiseCtx.createImageData(width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 255;
                data[i] = noise;
                data[i + 1] = noise;
                data[i + 2] = noise;
                data[i + 3] = 255;
            }
            
            noiseCtx.putImageData(imageData, 0, 0);
        }

        let time = 0;

        function animate() {
            // Очистка
            ctx.fillStyle = 'rgba(10, 10, 10, 1)';
            ctx.fillRect(0, 0, width, height);

            // Рисуем все пятна с режимом смешивания
            ctx.globalCompositeOperation = 'lighter';
            
            blobs.forEach(blob => {
                blob.update(time);
                blob.draw(time);
            });

            ctx.globalCompositeOperation = 'source-over';

            time++;
            requestAnimationFrame(animate);
        }

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            noiseCanvas.width = width;
            noiseCanvas.height = height;
            
            // Пересчитываем позиции пятен
            blobs.forEach((blob, i) => {
                if (i === 0) { blob.x = width * 0.2; blob.y = height * 0.3; }
                if (i === 1) { blob.x = width * 0.8; blob.y = height * 0.2; }
                if (i === 2) { blob.x = width * 0.5; blob.y = height * 0.7; }
                if (i === 3) { blob.x = width * 0.1; blob.y = height * 0.8; }
                if (i === 4) { blob.x = width * 0.9; blob.y = height * 0.6; }
                if (i === 5) { blob.x = width * 0.6; blob.y = height * 0.4; }
                if (i === 6) { blob.x = width * 0.3; blob.y = height * 0.6; }
            });
            
            drawNoise();
        });

        // Запуск
        drawNoise();
        animate();
    </script>
</body>
</html>
