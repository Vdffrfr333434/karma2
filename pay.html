<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monobank API Test</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1a1a1a; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; margin-left: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .buttons { display: grid; gap: 10px; }
        .btn { border: none; padding: 15px; border-radius: 12px; background: #000; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .btn:hover { background: #333; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        #status-area { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; font-size: 0.9rem; }
        .status-loading { background: #e3f2fd; color: #0d47a1; display: block !important; }
        .status-success { background: #e8f5e9; color: #2e7d32; display: block !important; }
        .status-error { background: #ffebee; color: #c62828; display: block !important; }
    </style>
</head>
<body>

<div class="card">
    <h1>Оплата Monobank</h1>
    
    <div class="input-group">
        <label for="apiKey">Ваш API Токен (X-Token):</label>
        <input type="password" id="apiKey" placeholder="Вставьте токен из api.monobank.ua">
    </div>

    <div class="buttons">
        <button class="btn" onclick="createInvoice(10)">10 грн</button>
        <button class="btn" onclick="createInvoice(20)">20 грн</button>
        <button class="btn" onclick="createInvoice(30)">30 грн</button>
    </div>

    <div id="status-area"></div>
</div>

<script>
    const statusArea = document.getElementById('status-area');
    const proxy = "https://corsproxy.io/?";

    // Функция обновления статуса на экране
    function showStatus(text, type) {
        statusArea.innerText = text;
        statusArea.className = 'status-' + type;
    }

    // 1. Создание счета
    async function createInvoice(amountGrn) {
        const token = document.getElementById('apiKey').value;
        if (!token) {
            alert("Пожалуйста, введите ваш API токен!");
            return;
        }

        showStatus("Создание счета...", "loading");

        const url = "https://api.monobank.ua/api/merchant/invoice/create";
        const body = {
            amount: amountGrn * 100, // сумма в копейках
            ccy: 980, // Грн
            merchantPaymInfo: { destination: "Тестовая покупка " + amountGrn + " грн" },
            // Передаем в redirectUrl текущий адрес, добавляя в него ID для проверки после возврата
            redirectUrl: window.location.origin + window.location.pathname + "?check_payment=true"
        };

        try {
            const response = await fetch(proxy + encodeURIComponent(url), {
                method: 'POST',
                headers: {
                    'X-Token': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (data.pageUrl) {
                // Сохраняем invoiceId в память браузера, чтобы проверить его при возврате
                localStorage.setItem('last_invoice_id', data.invoiceId);
                localStorage.setItem('mono_token', token); // Сохраняем токен для проверки
                
                showStatus("Счет создан! Перенаправление...", "success");
                setTimeout(() => window.location.href = data.pageUrl, 1000);
            } else {
                showStatus("Ошибка: " + (data.errText || "Неверный токен"), "error");
            }
        } catch (e) {
            showStatus("Ошибка сети или прокси", "error");
            console.error(e);
        }
    }

    // 2. Проверка статуса (срабатывает при загрузке страницы)
    async function checkStatus() {
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = localStorage.getItem('last_invoice_id');
        const token = localStorage.getItem('mono_token');

        if (urlParams.has('check_payment') && invoiceId && token) {
            showStatus("Проверяем оплату...", "loading");
            
            // Подставляем токен в поле ввода для удобства
            document.getElementById('apiKey').value = token;

            const url = `https://api.monobank.ua/api/merchant/invoice/status?invoiceId=${invoiceId}`;

            try {
                const response = await fetch(proxy + encodeURIComponent(url), {
                    method: 'GET',
                    headers: { 'X-Token': token }
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    showStatus("✅ Оплачено успешно!", "success");
                    localStorage.removeItem('last_invoice_id');
                } else if (data.status === 'created') {
                    showStatus("⏳ Ожидание оплаты...", "loading");
                } else {
                    showStatus("Статус: " + data.status, "error");
                }
            } catch (e) {
                showStatus("Не удалось проверить статус", "error");
            }
        }
    }

    // Запускаем проверку при открытии страницы
    window.onload = checkStatus;
</script>

</body>
</html>
