<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono Shop Fast</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; }
        .card { background: #222; padding: 2.5rem; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; width: 100%; max-width: 320px; border: 1px solid #333; }
        h1 { font-size: 1.2rem; margin-bottom: 2rem; letter-spacing: 1px; }
        .buttons { display: grid; gap: 15px; }
        .btn { border: none; padding: 18px; border-radius: 12px; background: #fff; color: #000; font-weight: 800; cursor: pointer; transition: all 0.3s; font-size: 1.1rem; }
        .btn:hover { background: #ccc; transform: scale(1.03); }
        #status-area { margin-top: 25px; font-size: 0.9rem; min-height: 20px; color: #aaa; }
        .status-success { color: #4caf50; font-weight: bold; }
        .status-error { color: #ff5252; }
    </style>
</head>
<body>

<div class="card">
    <h1>Оплатити  </h1>
    
    <div class="buttons">
        <button class="btn" onclick="createInvoice(100)">  за 100 ГРН</button>
        <button class="btn" onclick="createInvoice(200)">  за 200 ГРН</button>
        <button class="btn" onclick="createInvoice(300)">  за 300 ГРН</button>
    </div>

    <div id="status-area">Нажмите на кнопку для оплаты</div>
</div>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const MONO_TOKEN = "uQJ7XJ0WSnFxTa6cEg8QUV8dz9p190h-Px0cEI2nQIFI"; // <--- ВСТАВЬТЕ ВАШ ТОКЕН СЮДА
    const PROXY = "https://corsproxy.io/?";
    const API_URL = "https://api.monobank.ua/api/merchant/invoice";
    // --------------------

    const statusArea = document.getElementById('status-area');

    async function createInvoice(amount) {
        statusArea.innerHTML = "Генерация счета...";
        statusArea.className = "";

        const payload = {
            amount: amount * 100,
            ccy: 980,
            merchantPaymInfo: { destination: `Покупка товара (${amount} грн)` },
            redirectUrl: window.location.href.split('?')[0] + "?check=1"
        };

        try {
            const res = await fetch(PROXY + encodeURIComponent(`${API_URL}/create`), {
                method: 'POST',
                headers: { 'X-Token': MONO_TOKEN, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.pageUrl) {
                localStorage.setItem('last_id', data.invoiceId);
                window.location.href = data.pageUrl;
            } else {
                statusArea.innerText = "Ошибка: " + (data.errText || "Проверьте токен");
                statusArea.className = "status-error";
            }
        } catch (e) {
            statusArea.innerText = "Ошибка сети";
            statusArea.className = "status-error";
        }
    }

    async function checkStatus() {
        const params = new URLSearchParams(window.location.search);
        const invoiceId = localStorage.getItem('last_id');

        if (params.has('check') && invoiceId) {
            statusArea.innerText = "Проверка платежа...";
            
            try {
                const res = await fetch(PROXY + encodeURIComponent(`${API_URL}/status?invoiceId=${invoiceId}`), {
                    headers: { 'X-Token': MONO_TOKEN }
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    statusArea.innerText = "✅ ОПЛАЧЕНО УСПЕШНО";
                    statusArea.className = "status-success";
                    localStorage.removeItem('last_id');
                } else {
                    statusArea.innerText = "Статус: " + data.status;
                }
            } catch (e) {
                statusArea.innerText = "Ошибка при проверке";
            }
        }
    }

    window.onload = checkStatus;
</script>

</body>
</html>
